# Versions observed in the local 'gee' environment on 2026-11-22.
# This specification has not yet been tested in a clean environment.
# Conda packages provide the compiled geospatial/scientific dependencies.

name: sutlej-2025-reproduction

channels:
  - conda-forge

dependencies:
  - python=3.13
  - pip
  - numpy=2.5.3
  - pandas=3.1.1
  - matplotlib=3.11.2
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - scikit-image=0.26.0
  - geopandas=1.1.4
  - rasterio=1.5.1
  - pillow=12.3.0
  - networkx=3.6.1
  - shapely=2.1.2
  - gdal=3.13.3
  - jupyterlab=4.6.3
  - notebook=7.6.2
  - ipykernel=7.3.0
  - pip:
      - PyMaxflow==1.3.2
      - earthengine-api==1.7.52
      - geemap==0.39.0
      - optuna==5.0.0
